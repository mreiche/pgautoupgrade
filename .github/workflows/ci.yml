name: Build and push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
#  schedule:
#    - cron: "0 0 * * 0"

concurrency:
  group: build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # renovate: datasource=repology depName=homebrew/postgresql@14 versioning=loose
  PG_FROM: "14"
  # renovate: datasource=repology depName=homebrew/postgresql@18 versioning=loose
  PG_TO: "18"

permissions:
  packages: write

jobs:
  target-images:
    runs-on: ubuntu-26.04
    # otherwise, it would skip the build entirely (because the base step does not run)
    if: always()

    strategy:
      matrix:
        operating_system:
          - flavor: "alpine"
            # renovate: datasource=docker depName=alpine versioning=docker
            OS_VERSION: "3.24"
          - flavor: "debian"
            # renovate: datasource=docker depName=debian versioning=docker
            OS_VERSION: "13.7"

    steps:

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: "${{ matrix.operating_system.flavor }}.Dockerfile"
          load: true
          tags: pgautoupgrade-${{ matrix.operating_system.flavor }}:latest
          build-args: |
            "PGTARGET=${{ matrix.pg_target.PG_VERSION }}"
          cache-from: type=gha,scope=${{ matrix.operating_system.flavor }}
          cache-to: type=gha,scope=${{ matrix.operating_system.flavor }},mode=max


      - name: Install bats
        shell: sh
        run: |
          sudo apt-get install -y bats

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        shell: sh
        env:
          FLAVOR: ${{ matrix.operating_system.flavor }}
        run: |
          /usr/bin/env bats ./test/pg_upgrade-entrypoint-tests.sh
          /usr/bin/env bats ./test/pgautoupgrade-tests.sh

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=pr,prefix=${{ env.PG_FROM }}-${{ env.PG_TO }}.${{ matrix.operating_system.flavor }}${{ matrix.operating_system.OS_VERSION }},enable=${{ github.event_name == 'pull_request' }}
            ${{ env.PG_FROM }}-${{ env.PG_TO }}.${{ matrix.operating_system.flavor }}${{ matrix.operating_system.OS_VERSION }},enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: "${{ matrix.operating_system.flavor }}.Dockerfile"
          platforms: linux/amd64 #,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            "PGTARGET=${{ env.PG_TO }}"
          push: true
          cache-from: type=gha,scope=${{ matrix.operating_system.flavor }}
          cache-to: type=gha,scope=${{ matrix.operating_system.flavor }},mode=max
